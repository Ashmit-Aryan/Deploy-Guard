name: Build, Push and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ashmit-aryan/deployguard-demo

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install demo application dependencies
        working-directory: demo-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate demo application
        working-directory: demo-app
        run: |
          python -m compileall app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./demo-app
          file: ./demo-app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Notify DeployGuard
        env:
          DEPLOYGUARD_WEBHOOK_URL: ${{ secrets.DEPLOYGUARD_WEBHOOK_URL }}
          DEPLOYGUARD_WEBHOOK_SECRET: ${{ secrets.DEPLOYGUARD_WEBHOOK_SECRET }}
          DEPLOYGUARD_APPLICATION_ID: ${{ secrets.DEPLOYGUARD_APPLICATION_ID }}
        run: |
          curl --fail-with-body --request POST \
            "${DEPLOYGUARD_WEBHOOK_URL}/api/webhooks/github" \
            --header "Content-Type: application/json" \
            --header "X-DeployGuard-Secret: ${DEPLOYGUARD_WEBHOOK_SECRET}" \
            --data '{
              "application_id": "'"${DEPLOYGUARD_APPLICATION_ID}"'",
              "version": "'"${GITHUB_SHA}"'",
              "image": "'"${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"'",
              "commit_sha": "'"${GITHUB_SHA}"'"
            }'
